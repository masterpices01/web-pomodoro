<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>

  <div class="app-layout">
    <header class="title-bar">
      <div class="app-title"></div>
      <div class="top-right-tools">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme">🌞</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <div class="columns-container">
      <aside class="sidebar left-sidebar">
        <h3>Tasks</h3>
        <!-- 新增以下這行搜尋輸入框 -->
        <input type="text" id="taskSearchInput" class="task-search-input" placeholder="Search tasks...">
        <div id="taskList" class="task-buttons-container"></div>
      </aside>

      <main class="main-container">
        <h1 id="currentTaskDisplay" class="task-title">Default Task</h1>
        <div id="timer">--:--</div>
        
        <div class="controls">
          <button id="start">Start</button>
          <button id="pause">Pause</button>
          <button id="reset">Reset</button>
        </div>
      </main>

      <aside class="sidebar right-sidebar">
        <h3>Completed</h3>
        <ul id="completedList"></ul>
      </aside>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Settings</h2>
      
      <div class="setting-group">
        <h3>📋 Task Settings</h3>
        <label>Select Current Task:</label>
        <select id="taskSelect"></select>
        
        <div class="add-task-wrapper">
          <input type="text" id="newTaskInput" placeholder="Enter new task name...">
        </div>
        
        <div class="modal-buttons">
          <button id="addTaskBtn" class="action-btn">Add Task</button>
          <button id="deleteTaskBtn" class="action-btn danger">Delete Task</button>
        </div>
      </div>

      <div class="setting-group">
        <h3>🔊 Volume Control</h3>
        <div class="volume-row">
          <input type="range" id="volumeSlider" min="0" max="300" value="70" step="1">
          <span id="volumeValue">70%</span>
        </div>
      </div>
      
      <div class="setting-group">
        <h3>🔔 Alert Sound Volume</h3>
        <div class="volume-row">
          <input type="range" id="alertVolumeSlider" min="0" max="100" value="70">
          <span id="alertVolumeValue">70%</span>
        </div>
      </div>
    </div>
  </div>

  <div id="alertModal" class="modal">
    <div class="modal-content alert-modal-content">
      <div class="alert-icon">🎉</div>
      <h2 class="alert-title">Pomodoro Completed!</h2>
      <p id="alertTaskMessage" class="alert-message">Default Task</p>
      <button id="alertConfirmBtn" class="action-btn alert-confirm-btn">OK (Enter)</button>
    </div>
  </div>

  <audio id="alertSound" src="assets/dragon-studio-game-show-correct-tick-sound-416167.mp3"></audio>
  <audio id="music"></audio>
  <script src="app.js"></script>
</body>
</html>
